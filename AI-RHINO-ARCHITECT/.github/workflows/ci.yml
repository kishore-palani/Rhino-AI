name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AI-RHINO-ARCHITECT
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: AI-RHINO-ARCHITECT/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Lint
        run: ruff check apps/api/main.py apps/api/mcp/client.py rhino/adapters/base.py rhino/adapters/mcp.py grasshopper/tools/definitions.py
      - name: Type check
        run: mypy --explicit-package-bases apps/api/main.py apps/api/mcp/client.py rhino/adapters/base.py rhino/adapters/mcp.py grasshopper/tools/definitions.py
      - name: Test
        run: pytest --cov=. --cov-report=term-missing
